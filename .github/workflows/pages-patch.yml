name: pages-patch
on:
  push:
    paths:
      - 'patches/**'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: |
          set +e
          python3 patches/p1118.py index.html > /tmp/out 2>&1
          echo "exit=$?" > patch-result.txt
          cat /tmp/out >> patch-result.txt
          echo "bytes=$(wc -c < index.html)" >> patch-result.txt
          echo "sha=$(sha256sum index.html | cut -d' ' -f1)" >> patch-result.txt
      - name: Commit result
        run: |
          git config user.name "macro-bot"
          git config user.email "macro-bot@users.noreply.github.com"
          git add -A
          git rm -q --ignore-unmatch patches/p1118.py .github/workflows/pages-patch.yml
          git commit -m "macro: 11/18 morning refresh - CME Dec 96.8/0/3.2, 10Y 5.11/30Y 5.46, NVDA FY27Q3 landed, Oct retail +0.2%"
          git push
